<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Friesenberger Klasse 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: #080c08; scroll-behavior: smooth; }
body {
font-family: ‘DM Sans’, sans-serif;
color: #e2ddd4;
min-height: 100vh;
background: #080c08;
background-image:
radial-gradient(ellipse 80% 40% at 50% -10%, rgba(200,168,74,0.07) 0%, transparent 70%),
radial-gradient(ellipse 50% 30% at 100% 80%, rgba(61,186,98,0.04) 0%, transparent 60%);
overflow-x: hidden;
}

/* ── HEADER ── */
header {
position: sticky; top: 0; z-index: 100;
background: rgba(8,12,8,0.88);
backdrop-filter: blur(20px);
border-bottom: 1px solid rgba(255,255,255,0.07);
padding: 0 20px;
}
.header-inner {
max-width: 760px; margin: 0 auto;
display: flex; align-items: center; gap: 14px;
height: 60px;
}
.logo-badge {
width: 36px; height: 36px; border-radius: 9px;
border: 1.5px solid #c8a84a; overflow: hidden; flex-shrink: 0;
}
.logo-badge img { width: 100%; height: 100%; object-fit: cover; }
.header-text {}
.header-title {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 1.25rem; letter-spacing: 2px; color: #f8f4ec;
line-height: 1;
}
.header-live {
display: flex; align-items: center; gap: 5px;
font-size: 0.65rem; color: #4a5844; letter-spacing: 0.8px;
text-transform: uppercase; margin-top: 2px;
}
.pulse {
width: 6px; height: 6px; border-radius: 50%;
background: #3dba62;
animation: pulse 2s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.8)} }

/* ── LAYOUT ── */
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 60px; }

/* ── TABS ── */
.tabs {
display: flex; gap: 2px; margin: 20px 0 0;
background: #141a13; border: 1px solid rgba(255,255,255,0.07);
border-radius: 14px; padding: 4px; overflow: hidden;
}
.tab-btn {
flex: 1; padding: 9px 4px;
background: none; border: none; border-radius: 10px;
font-family: ‘DM Sans’, sans-serif; font-size: 0.78rem; font-weight: 500;
color: #4a5844; cursor: pointer; transition: all 0.2s; white-space: nowrap;
}
.tab-btn.active {
background: #1a221a; color: #c8a84a;
border: 1px solid rgba(200,168,74,0.2);
}

/* ── SECTION LABEL ── */
.sec-label {
font-size: 0.62rem; font-weight: 700; letter-spacing: 2px;
text-transform: uppercase; color: #4a5844; margin: 28px 0 12px;
}

/* ── SEASON HERO ── */
.season-hero {
background: linear-gradient(145deg, #111a10 0%, #0d160c 60%, #0a110a 100%);
border: 1px solid rgba(200,168,74,0.2);
border-radius: 20px; padding: 22px 20px 18px; margin: 16px 0;
position: relative; overflow: hidden;
}
.season-hero::before {
content: “”; position: absolute; inset: 0;
background: radial-gradient(ellipse 60% 50% at 100% 0%, rgba(200,168,74,0.06), transparent);
pointer-events: none;
}
.sh-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.sh-label { font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase; color: #c8a84a; font-weight: 700; margin-bottom: 5px; }
.sh-name {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 2rem; letter-spacing: 1px; color: #f8f4ec; line-height: 1;
}
.status-pill {
font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px;
padding: 5px 12px; border-radius: 20px; white-space: nowrap;
}
.status-live { background: rgba(61,186,98,0.12); color: #3dba62; border: 1px solid rgba(61,186,98,0.25); }
.status-done { background: rgba(200,168,74,0.12); color: #c8a84a; border: 1px solid rgba(200,168,74,0.25); }

/* Progress */
.prog-row { display: flex; justify-content: space-between; font-size: 0.7rem; color: #4a5844; margin-bottom: 7px; }
.prog-track { height: 4px; background: rgba(255,255,255,0.06); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.prog-fill { height: 100%; border-radius: 4px; background: linear-gradient(90deg, #c8a84a, #f2d060); transition: width 0.6s ease; }

/* Stats */
.sh-stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px; }
.sh-stat { background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.07); border-radius: 12px; padding: 10px 8px; text-align: center; }
.sh-stat-val { font-family: ‘Bebas Neue’, sans-serif; font-size: 1.6rem; letter-spacing: 1px; color: #f8f4ec; line-height: 1; }
.sh-stat-lbl { font-size: 0.58rem; letter-spacing: 1px; text-transform: uppercase; color: #4a5844; margin-top: 3px; }

/* Leader */
.leader {
display: flex; justify-content: space-between; align-items: center;
background: linear-gradient(90deg, rgba(200,168,74,0.1), rgba(200,168,74,0.04));
border: 1px solid rgba(200,168,74,0.2); border-radius: 12px; padding: 12px 14px;
}
.leader-lbl { font-size: 0.58rem; letter-spacing: 1.5px; text-transform: uppercase; color: #c8a84a; font-weight: 700; }
.leader-name { font-size: 0.92rem; font-weight: 600; color: #f2d060; margin-top: 3px; }
.leader-right { text-align: right; }
.leader-pts { font-family: ‘Bebas Neue’, sans-serif; font-size: 2.2rem; letter-spacing: 1px; color: #f2d060; line-height: 1; }
.leader-pts-lbl { font-size: 0.58rem; letter-spacing: 1px; text-transform: uppercase; color: #c8a84a; }

/* ── WINNER BANNER ── */
.winner-banner {
background: linear-gradient(135deg, #1c1808, #231e0a, #1a1608);
border: 1.5px solid #c8a84a;
border-radius: 18px; padding: 22px 20px; text-align: center; margin: 16px 0;
position: relative; overflow: hidden;
}
.winner-banner::before {
content: “”;  position: absolute; inset: 0;
background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(200,168,74,0.12), transparent);
pointer-events: none;
}
.wb-trophy { font-size: 2rem; margin-bottom: 4px; }
.wb-label { font-size: 0.6rem; letter-spacing: 2.5px; text-transform: uppercase; color: #c8a84a; font-weight: 700; }
.wb-name { font-family: ‘Bebas Neue’, sans-serif; font-size: 1.8rem; letter-spacing: 2px; color: #f2d060; margin-top: 4px; }
.wb-season { font-size: 0.72rem; color: #4a5844; margin-top: 4px; }

/* ── RANKING ── */
.ranking { background: #141a13; border: 1px solid rgba(255,255,255,0.07); border-radius: 18px; overflow: hidden; }
.rank-row {
display: flex; align-items: center; gap: 12px; padding: 13px 16px;
border-bottom: 1px solid rgba(255,255,255,0.07); transition: background 0.15s;
}
.rank-row:last-child { border-bottom: none; }
.rank-row.r1 { background: linear-gradient(90deg, rgba(200,168,74,0.05), transparent); }
.rank-pos { font-family: ‘Bebas Neue’, sans-serif; font-size: 1rem; color: #4a5844; min-width: 22px; text-align: center; }
.rank-pos.gold { color: #c8a84a; }
.rank-badge {
background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.13);
border-radius: 8px; width: 30px; height: 30px; display: flex;
align-items: center; justify-content: center;
font-family: ‘Bebas Neue’, sans-serif; font-size: 0.9rem; letter-spacing: 1px; color: #c8a84a;
flex-shrink: 0;
}
.rank-info { flex: 1; min-width: 0; }
.rank-name { font-size: 0.88rem; font-weight: 500; color: #e2ddd4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-record { font-size: 0.65rem; color: #4a5844; margin-top: 2px; }
.rank-right { text-align: right; flex-shrink: 0; }
.rank-pts-big { font-family: ‘Bebas Neue’, sans-serif; font-size: 1.3rem; letter-spacing: 1px; color: #f8f4ec; }
.rank-pts-lbl { font-size: 0.58rem; color: #4a5844; letter-spacing: 0.5px; text-transform: uppercase; }

/* ── TEAMS LIST ── */
.teams-list { display: flex; flex-direction: column; gap: 6px; }
.team-item {
display: flex; align-items: center; gap: 12px;
background: #141a13; border: 1px solid rgba(255,255,255,0.07);
border-radius: 12px; padding: 11px 14px;
}
.team-badge { font-family: ‘Bebas Neue’, sans-serif; font-size: 0.95rem; letter-spacing: 1px; color: #c8a84a; width: 24px; text-align: center; flex-shrink: 0; }
.team-name-txt { font-size: 0.88rem; font-weight: 500; color: #e2ddd4; }

/* ── MATCHES ── */
.runde-sep {
display: flex; align-items: center; gap: 10px;
margin: 20px 0 10px;
}
.runde-sep-line { flex: 1; height: 1px; background: rgba(255,255,255,0.07); }
.runde-sep-label {
font-size: 0.6rem; letter-spacing: 2px; text-transform: uppercase;
color: #4a5844; font-weight: 700; white-space: nowrap;
}

.match-card {
background: #141a13; border: 1px solid rgba(255,255,255,0.07);
border-radius: 14px; padding: 13px 15px; margin-bottom: 7px;
position: relative; overflow: hidden;
}
.match-card.played { border-color: rgba(255,255,255,0.08); }
.match-card-venue { font-size: 0.65rem; color: #4a5844; margin-bottom: 10px; display: flex; align-items: center; gap: 4px; }
.match-row { display: flex; align-items: center; gap: 8px; }
.match-team { flex: 1; }
.match-team.right { text-align: right; }
.match-team-id { font-size: 0.6rem; letter-spacing: 1px; text-transform: uppercase; color: #4a5844; font-weight: 700; }
.match-team-name { font-size: 0.88rem; font-weight: 500; color: #e2ddd4; margin-top: 2px; }
.match-score-wrap { text-align: center; min-width: 90px; }
.score-box {
display: inline-block;
background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.13);
border-radius: 8px; padding: 5px 10px;
font-family: ‘Bebas Neue’, sans-serif; font-size: 1rem; letter-spacing: 2px; color: #f8f4ec;
}
.score-box.pending {
color: #4a5844; font-family: ‘DM Sans’, sans-serif;
font-size: 0.65rem; font-weight: 400; letter-spacing: 0.5px; padding: 6px 10px;
}

/* ── TEAM SCHEDULE ── */
.team-sched-card {
background: #141a13; border: 1px solid rgba(255,255,255,0.07);
border-radius: 16px; margin-bottom: 10px; overflow: hidden;
}
.ts-header {
display: flex; justify-content: space-between; align-items: center;
padding: 13px 16px; border-bottom: 1px solid rgba(255,255,255,0.07);
background: rgba(255,255,255,0.02);
}
.ts-left { display: flex; align-items: center; gap: 10px; }
.ts-badge { font-family: ‘Bebas Neue’, sans-serif; font-size: 1rem; letter-spacing: 1px; color: #c8a84a; background: rgba(200,168,74,0.08); border: 1px solid rgba(200,168,74,0.2); border-radius: 8px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; }
.ts-name { font-size: 0.9rem; font-weight: 600; color: #f8f4ec; }
.ts-stats { display: flex; gap: 14px; }
.ts-stat { text-align: center; }
.ts-stat-val { font-family: ‘Bebas Neue’, sans-serif; font-size: 1.1rem; letter-spacing: 1px; }
.ts-stat-lbl { font-size: 0.55rem; letter-spacing: 1px; text-transform: uppercase; color: #4a5844; }

.ts-match-row {
display: flex; align-items: center; gap: 10px;
padding: 10px 16px; border-bottom: 1px solid rgba(255,255,255,0.07);
}
.ts-match-row:last-child { border-bottom: none; }
.result-tag { font-size: 0.6rem; font-weight: 700; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 20px; min-width: 44px; text-align: center; }
.rt-w { background: rgba(61,186,98,0.12); color: #3dba62; border: 1px solid rgba(61,186,98,0.2); }
.rt-l { background: rgba(212,88,88,0.1); color: #d45858; border: 1px solid rgba(212,88,88,0.2); }
.rt-p { background: rgba(255,255,255,0.04); color: #4a5844; border: 1px solid rgba(255,255,255,0.07); }
.ts-vs { flex: 1; }
.ts-vs-name { font-size: 0.84rem; font-weight: 500; color: #e2ddd4; }
.ts-vs-date { font-size: 0.64rem; color: #4a5844; margin-top: 2px; }
.ts-score-txt { font-family: ‘Bebas Neue’, sans-serif; font-size: 0.85rem; letter-spacing: 1px; color: #8a9882; }

/* ── SEASONS LIST ── */
.season-card {
background: #141a13; border: 1px solid rgba(255,255,255,0.07);
border-radius: 16px; padding: 16px 18px; margin-bottom: 10px;
}
.season-card.current { border-color: rgba(200,168,74,0.3); }
.sc-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
.sc-name { font-family: ‘Bebas Neue’, sans-serif; font-size: 1.2rem; letter-spacing: 1px; color: #f8f4ec; }
.sc-winner { font-size: 0.82rem; color: #c8a84a; font-weight: 500; margin-top: 6px; }
.sc-teams { font-size: 0.7rem; color: #4a5844; margin-top: 6px; line-height: 1.8; }
.sc-teams strong { color: #c8a84a; }

/* ── SPLIT TABS ── */
.sub-tabs { display: flex; gap: 6px; margin-bottom: 16px; }
.sub-tab { flex: 1; text-align: center; padding: 8px; background: #141a13; border: 1px solid rgba(255,255,255,0.07); border-radius: 10px; font-size: 0.75rem; font-weight: 500; color: #4a5844; cursor: pointer; transition: all 0.15s; }
.sub-tab.active { background: rgba(200,168,74,0.1); border-color: rgba(200,168,74,0.3); color: #c8a84a; }

/* ── EMPTY ── */
.empty { text-align: center; padding: 40px 20px; color: #4a5844; font-size: 0.85rem; line-height: 1.6; }
.empty-icon { font-size: 2rem; margin-bottom: 10px; }

/* ── ANIMATIONS ── */
@keyframes fadeUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
.fade-up { animation: fadeUp 0.4s ease forwards; }
</style>

</head>

<script>
const KEYS = ["friesenberger_v9","friesenberger_v8","friesenberger_v7"];
let store = null, tab = "season", spTab = "runden";

function loadData(){
  for(const k of KEYS){
    const raw = localStorage.getItem(k);
    if(raw){ try{ store=JSON.parse(raw); return; }catch(e){} }
  }
  store = defaultData();
}

function defaultData(){
  return {activeSeason:0,seasons:[{
    id:1,name:"Season 1 – 2026",closed:false,
    teams:{
      A:{long:"Jibril & Etnik",short:"Jibril & Etnik"},
      B:{long:"Guxim & Jack",short:"Guxim & Jack"},
      C:{long:"Mosab & Ashi",short:"Mosab & Ashi"},
      D:{long:"Kreshnik & Hamza",short:"Kreshnik & Hamza"},
      E:{long:"Durim & Armend",short:"Durim & Armend"}
    },
    matches:[
      [{t1:"A",t2:"E",s:[[6,3],[6,0],[7,6]],d:"26.03. – Yakinarena"},{t1:"B",t2:"D",s:[[6,2],[6,3],[6,0]],d:"26.03. – Yakinarena"}],
      [{t1:"A",t2:"D",s:[[6,3],[2,6],[1,6]],d:"30.03. – Unipadel"}, {t1:"B",t2:"C",s:[[5,7],[5,3],[]],d:"30.03. – Unipadel"}],
      [{t1:"D",t2:"C",s:[[0,6],[0,6],[3,6]],d:"16.04. – Rümlang"},  {t1:"B",t2:"E",s:[[0,6],[1,6],[2,6]],d:"08.04. – Yakinarena"}],
      [{t1:"A",t2:"C",s:[[2,6],[4,6],[2,6]],d:"14.04. – Spreitenbach"},{t1:"D",t2:"E",s:[[],[],[]],d:"Datum TBD"}],
      [{t1:"A",t2:"B",s:[[1,6],[5,7],[2,6]],d:"18.03. – PDL"},       {t1:"C",t2:"E",s:[[],[],[]],d:"Datum TBD"}],
      [{t1:"E",t2:"A",s:[[],[],[]],d:"Datum TBD"},{t1:"D",t2:"B",s:[[],[],[]],d:"Datum TBD"}],
      [{t1:"D",t2:"A",s:[[],[],[]],d:"Datum TBD"},{t1:"C",t2:"B",s:[[],[],[]],d:"Datum TBD"}],
      [{t1:"C",t2:"D",s:[[],[],[]],d:"Datum TBD"},{t1:"E",t2:"B",s:[[],[],[]],d:"Datum TBD"}],
      [{t1:"C",t2:"A",s:[[],[],[]],d:"Datum TBD"},{t1:"E",t2:"D",s:[[],[],[]],d:"Datum TBD"}],
      [{t1:"B",t2:"A",s:[[],[],[]],d:"Datum TBD"},{t1:"E",t2:"C",s:[[],[],[]],d:"Datum TBD"}]
    ]
  }]};
}

function AS(){ return store.seasons[store.activeSeason]; }

function computePts(s){
  const pts={},pl={},w={},l={};
  Object.keys(s.teams).forEach(t=>{pts[t]=0;pl[t]=0;w[t]=0;l[t]=0;});
  s.matches.flat().forEach(m=>{
    if(!m.s[0]||!m.s[0].length) return;
    let t1w=0,t2w=0;
    m.s.forEach(set=>{if(set.length<2)return;if(set[0]>set[1])t1w++;else if(set[1]>set[0])t2w++;});
    if(!t1w&&!t2w) return;
    pl[m.t1]++;pl[m.t2]++;
    if(t1w===3){pts[m.t1]+=3;w[m.t1]++;l[m.t2]++;}
    else if(t2w===3){pts[m.t2]+=3;w[m.t2]++;l[m.t1]++;}
    else if(t1w===2){pts[m.t1]+=2;pts[m.t2]+=1;w[m.t1]++;l[m.t2]++;}
    else if(t2w===2){pts[m.t2]+=2;pts[m.t1]+=1;w[m.t2]++;l[m.t1]++;}
  });
  return {pts,pl,w,l};
}

// ── TABS ──
window.setTab=function(t){
  tab=t;
  ["season","spielplan","duostats"].forEach(id=>{
    document.getElementById("tab"+id.charAt(0).toUpperCase()+id.slice(1)).style.display=t===id?"block":"none";
  });
  document.querySelectorAll(".tab-btn").forEach((b,i)=>b.classList.toggle("active",["season","spielplan","duostats"][i]===t));
  if(t==="season") renderSeason();
  if(t==="spielplan") renderSpielplan();
  if(t==="duostats") renderMainDuoStats();
};

window.setSpTab=function(t){
  spTab=t;
  document.querySelectorAll(".sub-tab").forEach((b,i)=>b.classList.toggle("active",["runden","teams"][i]===t));
  renderSpielplan();
};

// ── RENDER SEASON ──
function renderSeason(){
  const s=AS(); const closed=!!s.closed;
  const total=s.matches.flat().length;
  const done=s.matches.flat().filter(m=>m.s[0]&&m.s[0].length).length;
  const pct=total?Math.round(done/total*100):0;
  const {pts,pl,w,l}=computePts(s);
  const sorted=Object.entries(pts).sort((a,b)=>b[1]-a[1]);
  const winner=s.winner||(done===total&&total>0?sorted[0][0]:null);

  let h="";

  if(winner){
    h+=`<div class="winner-banner fade-up">
      <div class="wb-trophy">🏆</div>
      <div class="wb-label">Season Champion</div>
      <div class="wb-name">Team ${winner} – ${s.teams[winner].long}</div>
      <div class="wb-season">${s.name}</div>
    </div>`;
  }

  const badgeHtml=closed
    ?`<span class="status-pill status-done">Abgeschlossen</span>`
    :`<span class="status-pill status-live">Läuft</span>`;

  h+=`<div class="season-hero fade-up">
    <div class="sh-top">
      <div><div class="sh-label">Aktuelle Season</div><div class="sh-name">${s.name}</div></div>
      ${badgeHtml}
    </div>
    <div class="prog-row"><span>${done} / ${total} Spiele gespielt</span><span>${pct}%</span></div>
    <div class="prog-track"><div class="prog-fill" style="width:${pct}%"></div></div>
    <div class="sh-stats">
      <div class="sh-stat"><div class="sh-stat-val">${Object.keys(s.teams).length}</div><div class="sh-stat-lbl">Teams</div></div>
      <div class="sh-stat"><div class="sh-stat-val">${total}</div><div class="sh-stat-lbl">Spiele</div></div>
      <div class="sh-stat"><div class="sh-stat-val">${total-done}</div><div class="sh-stat-lbl">Offen</div></div>
    </div>
    ${sorted.length&&sorted[0][1]>0?`<div class="leader">
      <div><div class="leader-lbl">Tabellenführer</div><div class="leader-name">Team ${sorted[0][0]} – ${s.teams[sorted[0][0]].long}</div></div>
      <div class="leader-right"><div class="leader-pts">${sorted[0][1]}</div><div class="leader-pts-lbl">Punkte</div></div>
    </div>`:""}
  </div>`;

  h+=`<div class="sec-label">Rangliste</div>
  <div class="ranking fade-up">`;
  sorted.forEach(([t,p],i)=>{
    h+=`<div class="rank-row${i===0?" r1":""}">
      <div class="rank-pos${i===0?" gold":""}">${i===0?"🏆":i+1}</div>
      <div class="rank-badge">${t}</div>
      <div class="rank-info">
        <div class="rank-name">${s.teams[t].long}</div>
        <div class="rank-record">${pl[t]}G · ${w[t]}W · ${l[t]}N</div>
      </div>
      <div class="rank-right">
        <div class="rank-pts-big">${p}</div>
        <div class="rank-pts-lbl">Pkt</div>
      </div>
    </div>`;
  });
  h+=`</div>`;

  h+=`<div class="sec-label">Teams</div><div class="teams-list fade-up">`;
  Object.entries(s.teams).forEach(([id,t])=>{
    h+=`<div class="team-item"><div class="team-badge">${id}</div><div class="team-name-txt">${t.long}</div></div>`;
  });
  h+=`</div>`;

  document.getElementById("seasonContent").innerHTML=h;
}

// ── RENDER SPIELPLAN ──
function renderSpielplan(){
  const s=AS();
  let h="";

  if(spTab==="runden"){
    s.matches.forEach((week,w)=>{
      const isHin=w<5;
      const lbl=isHin?`Hinrunde · Runde ${w+1}`:`Rückrunde · Runde ${w-4}`;
      h+=`<div class="runde-sep"><div class="runde-sep-line"></div><div class="runde-sep-label">${lbl}</div><div class="runde-sep-line"></div></div>`;
      week.forEach(m=>{
        const played=m.s[0]&&m.s[0].length;
        const scoreHtml=played
          ?`<div class="score-box">${m.s.map(x=>x.length>=2?x[0]+":"+x[1]:"–").join("  ")}</div>`
          :`<div class="score-box pending">ausstehend</div>`;
        h+=`<div class="match-card${played?" played":""}">
          <div class="match-card-venue">📍 ${m.d}</div>
          <div class="match-row">
            <div class="match-team right">
              <div class="match-team-id">Team ${m.t1}</div>
              <div class="match-team-name">${s.teams[m.t1].long}</div>
            </div>
            <div class="match-score-wrap">${scoreHtml}</div>
            <div class="match-team">
              <div class="match-team-id">Team ${m.t2}</div>
              <div class="match-team-name">${s.teams[m.t2].long}</div>
            </div>
          </div>
        </div>`;
      });
    });
  } else {
    const {pts}=computePts(s);
    Object.entries(s.teams).forEach(([tid,tdata])=>{
      const games=[];
      s.matches.forEach((week,wi)=>week.forEach(m=>{
        if(m.t1!==tid&&m.t2!==tid) return;
        const opp=m.t1===tid?m.t2:m.t1;
        const played=m.s[0]&&m.s[0].length;
        let result="p",score="ausstehend";
        if(played){
          let tw=0,ow=0;
          m.s.forEach(set=>{if(set.length<2)return;const my=m.t1===tid?set[0]:set[1],op=m.t1===tid?set[1]:set[0];if(my>op)tw++;else if(op>my)ow++;});
          result=tw>ow?"w":"l";
          score=m.s.map(set=>set.length>=2?(m.t1===tid?set[0]+":"+set[1]:set[1]+":"+set[0]):"–").join("  ");
        }
        games.push({opp,played,result,score,date:m.d});
      }));
      const wins=games.filter(g=>g.result==="w").length;
      const losses=games.filter(g=>g.result==="l").length;
      h+=`<div class="team-sched-card">
        <div class="ts-header">
          <div class="ts-left">
            <div class="ts-badge">${tid}</div>
            <div class="ts-name">${tdata.long}</div>
          </div>
          <div class="ts-stats">
            <div class="ts-stat"><div class="ts-stat-val" style="color:#3dba62">${wins}</div><div class="ts-stat-lbl">W</div></div>
            <div class="ts-stat"><div class="ts-stat-val" style="color:#d45858">${losses}</div><div class="ts-stat-lbl">N</div></div>
            <div class="ts-stat"><div class="ts-stat-val">${pts[tid]||0}</div><div class="ts-stat-lbl">Pkt</div></div>
          </div>
        </div>`;
      games.forEach(g=>{
        const cls=g.result==="w"?"rt-w":g.result==="l"?"rt-l":"rt-p";
        const lbl=g.result==="w"?"WIN":g.result==="l"?"LOSS":"–";
        h+=`<div class="ts-match-row">
          <span class="result-tag ${cls}">${lbl}</span>
          <div class="ts-vs">
            <div class="ts-vs-name">vs Team ${g.opp} – ${s.teams[g.opp].long}</div>
            <div class="ts-vs-date">${g.date}</div>
          </div>
          <div class="ts-score-txt">${g.score}</div>
        </div>`;
      });
      h+=`</div>`;
    });
  }

  document.getElementById("spielplanContent").innerHTML=h||`<div class="empty"><div class="empty-icon">📅</div>Keine Spiele gefunden.</div>`;
}

// ── RENDER SEASONS ──
function renderSeasons(){
  let h=`<div class="sec-label" style="margin-top:16px;">Season-Archiv</div>`;
  [...store.seasons].reverse().forEach((s,ri)=>{
    const idx=store.seasons.length-1-ri;
    const isActive=idx===store.activeSeason;
    const {pts}=computePts(s);
    const sorted=Object.entries(pts).sort((a,b)=>b[1]-a[1]);
    const winner=s.winner||(s.matches.flat().every(m=>m.s[0]&&m.s[0].length)?sorted[0]?.[0]:null);
    h+=`<div class="season-card${isActive?" current":""}">
      <div class="sc-top">
        <div class="sc-name">${s.name}</div>
        <span class="status-pill ${s.closed?"status-done":"status-live"}">${s.closed?"Abgeschlossen":"Läuft"}</span>
      </div>
      ${winner?`<div class="sc-winner">🏆 Champion: Team ${winner} – ${s.teams[winner].long}</div>`:""}
      <div class="sc-teams">${Object.entries(s.teams).map(([k,v])=>`<strong>${k}</strong> ${v.long}`).join(" &nbsp;·&nbsp; ")}</div>
    </div>`;
  });
  document.getElementById("seasonsContent").innerHTML=h;
}

// ── AUTO UPDATE ──
window.addEventListener("storage",e=>{
  if(e.key&&e.key.startsWith("friesenberger")){ loadData(); renderCurrent(); }
});
setInterval(()=>{
  const prev=JSON.stringify(store);
  loadData();
  if(JSON.stringify(store)!==prev) renderCurrent();
},2000);

function renderCurrent(){
  if(tab==="season") renderSeason();
  if(tab==="spielplan") renderSpielplan();
  if(tab==="duostats") renderMainDuoStats();
}

loadData();
renderSeason();
</script>

function renderDuoStatsContent(){
  const container=document.getElementById('duoStatsContent');
  if(!container)return;
  const sidx=parseInt(document.getElementById('seasonDetailPage').dataset.seasonIdx);
  const s=store.seasons[sidx];
  if(!s)return;
  const pts2={},pl2={},w2={},l2={};
  Object.keys(s.teams).forEach(t=>{pts2[t]=0;pl2[t]=0;w2[t]=0;l2[t]=0;});
  s.matches.flat().forEach(m=>{
    if(!m.s[0]||!m.s[0].length)return;
    let a=0,b=0;
    m.s.forEach(x=>{if(x.length<2)return;if(x[0]>x[1])a++;else if(x[1]>x[0])b++;});
    if(!a&&!b)return;
    pl2[m.t1]++;pl2[m.t2]++;
    if(a===3){pts2[m.t1]+=3;w2[m.t1]++;l2[m.t2]++;}
    else if(b===3){pts2[m.t2]+=3;w2[m.t2]++;l2[m.t1]++;}
    else if(a===2){pts2[m.t1]+=2;pts2[m.t2]+=1;w2[m.t1]++;l2[m.t2]++;}
    else if(b===2){pts2[m.t2]+=2;pts2[m.t1]+=1;w2[m.t2]++;l2[m.t1]++;}
  });
  const duos=Object.entries(s.teams).map(([tid,t])=>{
    const played=pl2[tid]||0,wins=w2[tid]||0,losses=l2[tid]||0,points=pts2[tid]||0;
    const wr=played?Math.round(wins/played*100):0;
    let sW=0,sL=0,cb=0,ww=0;const ml=[];
    s.matches.flat().forEach(m=>{
      if(m.t1!==tid&&m.t2!==tid)return;
      if(!m.s[0]||!m.s[0].length)return;
      const my=m.t1===tid?0:1,op=1-my;
      let myw=0,opw=0;
      m.s.forEach(x=>{if(x.length<2)return;if(x[my]>x[op])myw++;else if(x[op]>x[my])opw++;});
      sW+=myw;sL+=opw;
      if(m.s.length>=2&&m.s[0].length>=2&&m.s[0][op]>m.s[0][my]&&myw>opw)cb++;
      if(myw===3&&opw===0)ww++;
      const sc=m.s.map(x=>x.length>=2?(m.t1===tid?x[0]+':'+x[1]:x[1]+':'+x[0]):'–').join(' ');
      ml.push({win:myw>opw,opp:m.t1===tid?m.t2:m.t1,score:sc});
    });
    return {tid,t,played,wins,losses,points,wr,sW,sL,sd:sW-sL,swr:sW+sL?Math.round(sW/(sW+sL)*100):0,cb,ww,ml};
  }).sort((a,b)=>b.wr-a.wr||b.points-a.points);
  // Find Guxim's team (B)
  const myTeam = duos.find(d => d.tid === 'B');
  let h = '';

  if(myTeam){
    const wr = myTeam.wr;
    const sd = myTeam.sd >= 0 ? '+'+myTeam.sd : myTeam.sd;
    h += '<div style="background:linear-gradient(135deg,#1a1f0e,#232810,#1a1f0e);border:1.5px solid #c8a84a;border-radius:16px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden">';

    h += '<div style="height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:12px">';
    h += '<div style="height:100%;width:'+wr+'%;background:linear-gradient(90deg,#c8a84a,#f2d060);border-radius:4px"></div></div>';
    h += '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">';
    h += '<div style="background:rgba(0,0,0,.3);border-radius:8px;padding:8px;text-align:center"><div style="font-size:1.2rem;font-weight:800;color:#3dba62">'+myTeam.wins+'</div><div style="font-size:.5rem;color:#4a5844;text-transform:uppercase">Siege</div></div>';
    h += '<div style="background:rgba(0,0,0,.3);border-radius:8px;padding:8px;text-align:center"><div style="font-size:1.2rem;font-weight:800;color:#d45858">'+myTeam.losses+'</div><div style="font-size:.5rem;color:#4a5844;text-transform:uppercase">Niederl.</div></div>';
    h += '<div style="background:rgba(0,0,0,.3);border-radius:8px;padding:8px;text-align:center"><div style="font-size:1.2rem;font-weight:800;color:#f8f4ec">'+myTeam.points+'</div><div style="font-size:.5rem;color:#4a5844;text-transform:uppercase">Punkte</div></div>';
    h += '<div style="background:rgba(0,0,0,.3);border-radius:8px;padding:8px;text-align:center"><div style="font-size:1.2rem;font-weight:800;color:'+(myTeam.sd>=0?'#3dba62':'#d45858')+'">'+sd+'</div><div style="font-size:.5rem;color:#4a5844;text-transform:uppercase">Satzd.</div></div>';
    h += '</div></div>';
  }

  h += '<div style="font-size:.58rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#4a5844;margin:4px 0 10px">Alle Duos</div>';

  duos.forEach((d,i)=>{

    const matches=d.ml.map(m=>'<div style="display:flex;align-items:center;gap:9px;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.05)"><span style="font-size:.6rem;font-weight:800;padding:3px 8px;border-radius:20px;min-width:40px;text-align:center;background:'+(m.win?'rgba(61,186,98,.1)':'rgba(212,88,88,.1)')+';color:'+(m.win?'#3dba62':'#d45858')+'">'+(m.win?'WIN':'LOSS')+'</span><div style="flex:1"><div style="font-size:.8rem;font-weight:500;color:#e2ddd4">vs Team '+m.opp+' – '+((s.teams[m.opp]&&s.teams[m.opp].long)||m.opp)+'</div><div style="font-size:.62rem;color:#4a5844">'+m.score+'</div></div></div>').join('')||'<div style="padding:12px;text-align:center;color:#4a5844;font-size:.78rem">Noch keine Spiele</div>';

    </div>
    <div style="max-width:720px;margin:0 auto;padding:0 16px 40px">
      ${winner?'<div style="background:linear-gradient(135deg,#1c1808,#231e0a);border:1.5px solid #c8a84a;border-radius:16px;padding:18px;text-align:center;margin:16px 0"><div style="font-size:1.5rem">🏆</div><div style="font-size:.58rem;letter-spacing:2.5px;text-transform:uppercase;color:#c8a84a;font-weight:700;margin-top:4px">Champion</div><div style="font-size:1.7rem;font-weight:900;letter-spacing:1px;color:#f2d060;margin-top:4px">Team '+winner+' – '+s.teams[winner].long+'</div></div>':''}
      <div style="background:linear-gradient(145deg,#111a10,#0d160c);border:1px solid rgba(200,168,74,.2);border-radius:18px;padding:18px;margin:${winner?'8px':'16px'} 0 12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:12px">
          <span style="font-size:.58rem;letter-spacing:2px;text-transform:uppercase;color:#c8a84a;font-weight:700">${isActive?'Aktive Season':'Archiv'}</span>
          <span style="font-size:.62rem;font-weight:700;padding:3px 10px;border-radius:20px;background:${s.closed?'rgba(200,168,74,.1)':'rgba(61,186,98,.1)'};color:${s.closed?'#c8a84a':'#3dba62'};border:1px solid ${s.closed?'rgba(200,168,74,.2)':'rgba(61,186,98,.2)'}">${s.closed?'Abgeschlossen':'Läuft'}</span>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:.68rem;color:#4a5844;margin-bottom:6px"><span>${done} / ${total} Spiele</span><span>${pct}%</span></div>
        <div style="height:4px;background:rgba(255,255,255,.06);border-radius:4px;overflow:hidden;margin-bottom:14px"><div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#c8a84a,#f2d060);border-radius:4px"></div></div>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:7px">
          <div style="background:rgba(0,0,0,.25);border-radius:10px;padding:9px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:#f8f4ec">${Object.keys(s.teams).length}</div><div style="font-size:.55rem;color:#4a5844;text-transform:uppercase">Teams</div></div>
          <div style="background:rgba(0,0,0,.25);border-radius:10px;padding:9px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:#f8f4ec">${total}</div><div style="font-size:.55rem;color:#4a5844;text-transform:uppercase">Spiele</div></div>
          <div style="background:rgba(0,0,0,.25);border-radius:10px;padding:9px;text-align:center"><div style="font-size:1.5rem;font-weight:800;color:#f8f4ec">${total-done}</div><div style="font-size:.55rem;color:#4a5844;text-transform:uppercase">Offen</div></div>
        </div>
      </div>
      ${acc('acc-rangliste','🏆','Rangliste',sorted.length+' Teams','<div style=\"background:#141a13;border-radius:10px;overflow:hidden\">'+rankRows+'</div>')}
      ${acc('acc-teams','👥','Teams',Object.keys(s.teams).length+' Duos','<div style=\"display:flex;flex-direction:column;gap:6px\">'+teamRows+'</div>')}
      ${acc('acc-spielplan','📅','Spielplan',done+'/'+total+' Spiele',spHtml)}
      ${acc('acc-duostats','📊','DuoStats','Statistiken aller Duos','<div id=\"duoStatsContent\">Lade...</div>')}
    </div>`;

  document.body.appendChild(page);
};
</script>

</body>
</html>
